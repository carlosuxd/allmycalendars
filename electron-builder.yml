appId: com.carlos.allmycalendars
productName: All My Calendars
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - resources/**
# Smaller installers: max compression, English-only Chromium locales
compression: maximum
electronLanguages:
  - en
win:
  target: nsis
nsis:
  # One-click: running a newer Setup just updates the installed app (no wizard)
  oneClick: true
  # Per-user install, no admin prompt
  perMachine: false
  # Reopen the app after installing or updating
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: All My Calendars
  # Accounts and settings in %APPDATA% are never removed
  deleteAppDataOnUninstall: false
mac:
  target: dmg
  category: public.app-category.productivity
  # Developer ID Application certificate (must be in the login keychain)
  identity: "Carlos Collazos (85TS9FR52Q)"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Credentials come from the APPLE_KEYCHAIN_PROFILE set in the build:mac script
  notarize: true
dmg:
  # LZFSE compression: smaller than the default UDZO (macOS 10.11+)
  format: ULFO
asarUnpack:
  - resources/**
